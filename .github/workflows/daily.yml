name: Daily MLB Bot 推播

on:
  schedule:
    # 每天 UTC 時間 00:00 觸發（等於台灣時間早上 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援手動按鈕觸發測試

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行推播腳本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
